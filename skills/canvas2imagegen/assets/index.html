<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Canvas2ImageGen</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg
      class="icon-defs"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <symbol id="i-pen" viewBox="0 0 24 24">
          <path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-5-5L4 14z" />
        </symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24">
          <path
            d="m4 13 9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8H8l-4-4a2 2 0 0 1 0-3Zm3-3 9 9M13 20h9"
          />
        </symbol>
        <symbol id="i-line" viewBox="0 0 24 24">
          <path d="m5 19 14-14" />
          <circle cx="5" cy="19" r="1" />
          <circle cx="19" cy="5" r="1" />
        </symbol>
        <symbol id="i-fill" viewBox="0 0 24 24">
          <path
            d="m5 3 9 9M3 10l7-7 9 9-7 7a2 2 0 0 1-3 0l-6-6a2 2 0 0 1 0-3Zm1 3h14"
          />
          <path d="M20 15s-2 2.5-2 4a2 2 0 0 0 4 0c0-1.5-2-4-2-4Z" />
        </symbol>
        <symbol id="i-rect" viewBox="0 0 24 24">
          <rect x="4" y="5" width="16" height="14" rx="2" />
        </symbol>
        <symbol id="i-ellipse" viewBox="0 0 24 24">
          <ellipse cx="12" cy="12" rx="9" ry="7" />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="m8 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12" />
        </symbol>
        <symbol id="i-redo" viewBox="0 0 24 24">
          <path d="m16 4 5 5-5 5m4-5H10a6 6 0 0 0 0 12" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="13" rx="2" />
          <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4" />
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
          <path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3" />
        </symbol>
      </defs>
    </svg>
    <main class="app">
      <header class="header">
        <div class="brand" aria-label="Canvas2ImageGen">
          <span class="brand-mark"
            ><svg><use href="#i-pen" /></svg></span
          >canvas<span class="brand-light">2imagegen</span>
        </div>
        <div class="export-actions">
          <button id="download" class="button secondary" disabled>
            <svg><use href="#i-download" /></svg>Download PNG
          </button>
          <button id="copy" class="button secondary" disabled>
            <svg><use href="#i-copy" /></svg><span>Copy image</span>
          </button>
          <button id="use-sketch" class="button primary" disabled>
            <svg><use href="#i-send" /></svg><span>Use sketch</span>
          </button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>
      <section class="workspace" aria-label="Sketchpad">
        <div class="toolbar" aria-label="Drawing controls">
          <div class="tools" role="group" aria-label="Tools">
            <button
              class="tool selected"
              data-tool="pen"
              aria-label="Pen"
              aria-pressed="true"
              title="Pen (B)"
            >
              <svg><use href="#i-pen" /></svg>
            </button>
            <button
              class="tool"
              data-tool="eraser"
              aria-label="Eraser"
              aria-pressed="false"
              title="Eraser (E)"
            >
              <svg><use href="#i-eraser" /></svg>
            </button>
            <button
              class="tool"
              data-tool="fill"
              aria-label="Fill"
              aria-pressed="false"
              title="Fill (F)"
            >
              <svg><use href="#i-fill" /></svg>
            </button>
            <button
              class="tool"
              data-tool="line"
              aria-label="Line"
              aria-pressed="false"
              title="Line (L)"
            >
              <svg><use href="#i-line" /></svg>
            </button>
            <button
              class="tool"
              data-tool="rect"
              aria-label="Rectangle"
              aria-pressed="false"
              title="Rectangle (R)"
            >
              <svg><use href="#i-rect" /></svg>
            </button>
            <button
              class="tool"
              data-tool="ellipse"
              aria-label="Ellipse"
              aria-pressed="false"
              title="Ellipse (O)"
            >
              <svg><use href="#i-ellipse" /></svg>
            </button>
          </div>
          <div class="style-controls">
            <div class="color-group">
              <div class="palette" role="group" aria-label="Ink color">
                <button
                  class="swatch selected"
                  data-color="#252933"
                  style="--swatch: #252933"
                  aria-label="Charcoal"
                  aria-pressed="true"
                ></button>
                <button
                  class="swatch"
                  data-color="#4b5cdb"
                  style="--swatch: #4b5cdb"
                  aria-label="Blue"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch"
                  data-color="#df6155"
                  style="--swatch: #df6155"
                  aria-label="Coral"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch"
                  data-color="#d9a434"
                  style="--swatch: #d9a434"
                  aria-label="Gold"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch"
                  data-color="#408879"
                  style="--swatch: #408879"
                  aria-label="Green"
                  aria-pressed="false"
                ></button>
                <button
                  class="swatch"
                  data-color="#a66dba"
                  style="--swatch: #a66dba"
                  aria-label="Purple"
                  aria-pressed="false"
                ></button>
              </div>
              <label class="custom-color"
                ><input
                  id="color"
                  type="color"
                  value="#252933"
                  aria-label="Custom ink color"
              /></label>
            </div>
            <div class="size-group">
              <span class="stroke-preview" aria-hidden="true"
                ><span id="stroke-dot"></span
              ></span>
              <input
                id="size"
                type="range"
                min="2"
                max="48"
                value="6"
                aria-label="Stroke size"
                title="Stroke size"
              />
              <output id="size-value" for="size">6 px</output>
            </div>
          </div>
          <div class="history-actions">
            <button
              id="undo"
              class="icon-button"
              aria-label="Undo"
              title="Undo (⌘/Ctrl Z)"
              disabled
            >
              <svg><use href="#i-undo" /></svg>
            </button>
            <button
              id="redo"
              class="icon-button"
              aria-label="Redo"
              title="Redo (⌘/Ctrl Shift Z)"
              disabled
            >
              <svg><use href="#i-redo" /></svg>
            </button>
            <span class="divider"></span
            ><button id="clear" class="clear-button" disabled>Clear</button>
          </div>
        </div>
        <div class="paper-wrap">
          <div class="paper">
            <canvas
              id="canvas"
              width="1200"
              height="900"
              aria-label="Drawing canvas. Draw with a mouse, finger, or stylus."
              >Your browser needs canvas support to use this sketchpad.</canvas
            >
          </div>
        </div>
      </section>
      <noscript>Enable JavaScript to draw and export your sketch.</noscript>
    </main>
  </body>
</html>
